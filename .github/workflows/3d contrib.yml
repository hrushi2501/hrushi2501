name: 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hrushi2501
          MAX_REPOS: 10
          SETTING_JSON: |
            {
              "type": "normal",
              "backgroundColor": "#0a0a0a",
              "foregroundColor": "#c9c9c9",
              "strongColor": "#e8e8e8",
              "weakColor": "#2a2a2a",
              "radarColor": "#6e6e6e",
              "growingAnimation": true,
              "contribColors": ["#161616", "#2a2a2a", "#444444", "#7a7a7a", "#e8e8e8"]
            }
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3d contrib calendar"
          git push
